name: CI

# Every pull request and every merge to main: build, and test, on two
# independent runners.
#
# Nothing is published and nothing is deployed. Vercel deploys this site from
# its own build, configured in Vercel rather than here, so a green tick means
# one thing -- this commit is good.
#
# The push trigger is NOT redundant the way it would be in a -be repo. There,
# cd.yml re-runs Build and Test after a merge, so ci.yml can be pull_request
# only. Here there is no cd.yml, and Vercel's build does not run
# .github/actions/test -- it runs `bun run build` and ships the result. This
# workflow is the only thing that ever runs the assertions.
#
# Two jobs, because the fleet contract is that CI is exactly Test and Build,
# run independently: two checks, each saying its own thing. That costs each
# job its own checkout and its own `bun install` -- and Test pays twice, since
# everything it asserts is a property of ./dist, which a job cannot inherit
# from a sibling. Test builds first, in its own workspace, and asserts on what
# it built.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only. This workflow only inspects the tree.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    # This build is seconds. Ten minutes means something has hung, and it should
    # say so here rather than sit until the runner's own timeout hours later.
    timeout-minutes: 10
    steps:
      # Third-party actions are pinned by SHA, with the tag in a trailing
      # comment so the version is still readable. A tag is a moving reference:
      # whoever can move it can run code in this job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Reads .mise.toml, which is where bun's version is already pinned for
      # everyone working on this repo. This used to be oven-sh/setup-bun with
      # `bun-version: "1.3"` written out here -- a second place to change one
      # version, and two places drift.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Build
        uses: ./.github/actions/build

  test:
    name: Test
    runs-on: ubuntu-24.04
    # Same clock as the build job: seconds unless something has hung, and a
    # hang should say so here rather than sit until the runner's own timeout
    # hours later.
    timeout-minutes: 10
    steps:
      # Third-party actions are pinned by SHA, with the tag in a trailing
      # comment so the version is still readable. A tag is a moving reference:
      # whoever can move it can run code in this job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Reads .mise.toml, which is where bun's version is already pinned for
      # everyone working on this repo. This used to be oven-sh/setup-bun with
      # `bun-version: "1.3"` written out here -- a second place to change one
      # version, and two places drift.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      # The test action asserts on ./dist, and a job cannot see a sibling
      # job's workspace -- so Test builds first, in its own workspace, and
      # asserts on what it built.
      - name: Build
        uses: ./.github/actions/build

      - name: Test
        uses: ./.github/actions/test
