name: CI

# A static site has one way to be broken that matters: it does not build. That
# is the whole check.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"
      - run: bun install --frozen-lockfile
      - run: bun run build
      # A build that emits nothing still "succeeds", so the artefact is checked
      # rather than the exit code.
      - name: The page was actually written
        run: test -s dist/index.html
