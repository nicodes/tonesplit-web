# Keeps the pinned `uses:` refs in .github/workflows and .github/actions current.
#
# Every third-party action here is pinned to a commit SHA rather than a tag,
# which is the point: a tag is a moving reference, and whoever can move it can
# run code in these jobs. The cost of a SHA is that nothing tells you when it
# has gone stale -- a tag at least reads as a version. This is the thing that
# tells you.
#
# One pull request per dependency, on purpose. The shared merge gate
# (scripts/engineering/helpers/dependency-policy.py) always rejects grouped
# updates -- a group is several risk profiles in one diff, and the gate cannot
# say yes to half of one -- so grouping here would only ever produce PRs the
# gate refuses. Each minor and patch update gets its own PR and its own
# exact-head Test and Build gate; majors the policy deems ineligible stay
# manual.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
